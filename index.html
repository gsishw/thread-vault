<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREAD VAULT - Emerging Designers Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
            background-color: #0d0d0d;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(22, 22, 26, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tag-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card px-4 py-3 border-b border-zinc-800 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black tracking-widest text-white flex items-center gap-1">
                THREAD <span class="text-xs bg-white text-black px-1.5 py-0.5 font-bold rounded">VAULT</span>
            </h1>
            <p class="text-[10px] text-zinc-400 tracking-wider uppercase">Emerging Designers Archives</p>
        </div>
        <button onclick="openModal('apply-modal')" class="text-xs bg-zinc-100 hover:bg-white text-black font-bold px-3 py-1.5 rounded-full transition flex items-center gap-1 shadow-lg">
            <i class="fa-solid fa-plus text-[10px]"></i> 掲載申請 (無料)
        </button>
    </header>

    <!-- Main Hero Banner -->
    <section class="p-4">
        <div class="relative rounded-2xl overflow-hidden bg-gradient-to-br from-zinc-900 via-zinc-900 to-zinc-800 p-5 border border-zinc-800 shadow-2xl">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl"></div>
            <span class="text-[10px] uppercase tracking-widest text-purple-400 font-bold bg-purple-950/60 border border-purple-800/50 px-2.5 py-1 rounded-full inline-block mb-2">
                Concept Store
            </span>
            <h2 class="text-xl font-bold text-white leading-tight mb-2">
                大手では出会えない、<br>新鋭デザイナーの初期作を掘る。
            </h2>
            <p class="text-xs text-zinc-400 leading-relaxed mb-4">
                活動開始3年以内のインディーズ・ストリートブランド限定。作り手のストーリーとこだわりを直接ディグるWebカタログ。
            </p>
            <div class="flex gap-2">
                <button onclick="filterItems('all')" class="text-xs bg-white text-black font-bold px-4 py-2 rounded-lg">
                    すべてのブランド
                </button>
                <button onclick="openModal('ai-modal')" class="text-xs glass-card text-white font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 border border-purple-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> AIでスタイル探し
                </button>
            </div>
        </div>
    </section>

    <!-- Filter Categories -->
    <section class="px-4 mb-4">
        <div class="flex gap-2 overflow-x-auto hide-scrollbar text-xs">
            <button onclick="filterItems('all')" class="filter-btn active bg-zinc-800 text-white px-3.5 py-1.5 rounded-full border border-zinc-700 whitespace-nowrap">すべて</button>
            <button onclick="filterItems('Y2K/Cyber')" class="filter-btn bg-zinc-900 text-zinc-400 px-3.5 py-1.5 rounded-full border border-zinc-800 whitespace-nowrap">Y2K / サイバー</button>
            <button onclick="filterItems('Street/Subculture')" class="filter-btn bg-zinc-900 text-zinc-400 px-3.5 py-1.5 rounded-full border border-zinc-800 whitespace-nowrap">ストリート / サブカル</button>
            <button onclick="filterItems('Graphic')" class="filter-btn bg-zinc-900 text-zinc-400 px-3.5 py-1.5 rounded-full border border-zinc-800 whitespace-nowrap">グラフィックT</button>
            <button onclick="filterItems('Remake/Handmade')" class="filter-btn bg-zinc-900 text-zinc-400 px-3.5 py-1.5 rounded-full border border-zinc-800 whitespace-nowrap">リメイク / ハンドメイド</button>
        </div>
    </section>

    <!-- Item Catalog Feed -->
    <main class="px-4 grid grid-cols-1 sm:grid-cols-2 gap-5" id="catalog-grid">
        <!-- JSでカードを動的に生成します -->
    </main>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-zinc-800 px-6 py-3 flex justify-around items-center z-40">
        <button class="flex flex-col items-center gap-1 text-white">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] font-bold">ディグる</span>
        </button>
        <button onclick="openModal('ai-modal')" class="flex flex-col items-center gap-1 text-zinc-500 hover:text-white transition">
            <i class="fa-solid fa-wand-magic-sparkles text-lg text-purple-400"></i>
            <span class="text-[10px]">AIマッチ</span>
        </button>
        <button onclick="openModal('apply-modal')" class="flex flex-col items-center gap-1 text-zinc-500 hover:text-white transition">
            <i class="fa-solid fa-store text-lg"></i>
            <span class="text-[10px]">掲載する</span>
        </button>
    </nav>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center hidden p-0 sm:p-4 transition-all">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto hide-scrollbar p-5 relative">
            <button onclick="closeModal('detail-modal')" class="absolute top-4 right-4 w-8 h-8 bg-zinc-800 text-zinc-300 rounded-full flex items-center justify-center font-bold z-10">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- AI Match Modal -->
    <div id="ai-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-5 relative">
            <button onclick="closeModal('ai-modal')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-solid fa-wand-magic-sparkles text-purple-400 text-xl"></i>
                <h3 class="text-base font-bold text-white">AI スタイル提案</h3>
            </div>
            <p class="text-xs text-zinc-400 mb-4">気分や着たい系統を入力すると、登録されている新鋭ブランドからAIがぴったりな服を提案します。</p>
            <textarea id="ai-input" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-500 mb-3" placeholder="例: ハイパーポップのイベントに着ていく、存在感のあるサイバーっぽいパーカー"></textarea>
            <button onclick="runAiRecommend()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-sparkles"></i> おすすめの服を探す
            </button>
            <div id="ai-result" class="mt-4 hidden p-3 bg-zinc-950 rounded-xl border border-purple-900/40 text-xs leading-relaxed text-zinc-300"></div>
        </div>
    </div>

    <!-- Apply Modal -->
    <div id="apply-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center hidden p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-5 relative">
            <button onclick="closeModal('apply-modal')" class="absolute top-4 right-4 text-zinc-400 hover:text-white">✕</button>
            <h3 class="text-base font-bold text-white mb-1">掲載申請（完全無料）</h3>
            <p class="text-xs text-zinc-400 mb-4">活動開始から3年以内のブランド様であれば無料で作品を掲載できます。BASE/STORESなどの購入リンクへ誘導します。</p>
            <form onsubmit="handleApply(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-1">ブランド名</label>
                    <input type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-white">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-1">公式オンラインストアURL (BASE / STORES等)</label>
                    <input type="url" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-white" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-1">X (Twitter) または Instagram ID</label>
                    <input type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-white" placeholder="@brand_name">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-1">ブランドコンセプト / メッセージ</label>
                    <textarea rows="3" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-white" placeholder="作っている服へのこだわりやカルチャー背景など"></textarea>
                </div>
                <button type="submit" class="w-full bg-white text-black font-bold py-2.5 rounded-xl text-xs transition">
                    申請を送信する
                </button>
            </form>
        </div>
    </div>

    <script>
        // サンプルデータ：新鋭デザイナーブランド
        const items = [
            {
                id: 1,
                brand: "NEO-CYBERIA",
                since: "2025年設立 (1年目)",
                title: "Over-Sized Cyber Zip Hoodie",
                price: "¥12,800",
                category: "Y2K/Cyber",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80",
                designer: "REN / 21yo",
                story: "HyperpopやDTMカルチャーのサイバー感を重厚なヘビーウェイトスウェットに落とし込んだ1着。リフレクタープリントと極太ジップで重厚感を重視。",
                storeUrl: "https://base.in"
            },
            {
                id: 2,
                brand: "NULL_OBJECT",
                since: "2026年設立 (半年目)",
                title: "Distressed Graphic Boxy Tee",
                price: "¥6,500",
                category: "Graphic",
                image: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80",
                designer: "KAI",
                story: "「意味のない記号」をテーマにしたシルクスクリーンプリントT。1枚ずつ手作業でダメージ加工を施しているため、全て世界に1着の風合い。",
                storeUrl: "https://stores.jp"
            },
            {
                id: 3,
                brand: "SAD_BOYS_CLUB",
                since: "2024年設立 (2年目)",
                title: "Deconstructed Denim Cargo",
                price: "¥18,000",
                category: "Remake/Handmade",
                image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=800&q=80",
                designer: "SORA",
                story: "古着のブラックデニムを解体し、ギミックポケットとシルバーパーツを再構築。膝下のジップでフレアシルエットへ切り替え可能。",
                storeUrl: "https://base.in"
            },
            {
                id: 4,
                brand: "VIRTUAL_RAVE",
                since: "2025年設立 (1年目)",
                title: "Acid Mesh Layered Long Sleeve",
                price: "¥8,200",
                category: "Street/Subculture",
                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80",
                designer: "YUKI",
                story: "深夜のクラブカルチャーから着想を得たシースルーメッシュロンT。ネオンカラーのレイヤードで夜の街に映えるデザイン。",
                storeUrl: "https://base.in"
            }
        ];

        // カタログを描画
        function renderCatalog(filter = 'all') {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            const filteredItems = filter === 'all' ? items : items.filter(i => i.category === filter);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl overflow-hidden border border-zinc-800 transition hover:border-zinc-700 cursor-pointer";
                card.onclick = () => showDetail(item.id);

                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden bg-zinc-950">
                        <img src="${item.image}" class="w-full h-full object-cover transition duration-500 hover:scale-105" alt="${item.title}">
                        <span class="absolute top-3 left-3 text-[10px] font-bold bg-black/70 backdrop-blur-md text-white px-2.5 py-1 rounded-full border border-white/10">
                            ${item.brand}
                        </span>
                        <span class="absolute bottom-3 right-3 text-[10px] font-bold bg-purple-900/80 backdrop-blur-md text-purple-200 px-2 py-0.5 rounded border border-purple-500/30">
                            ${item.since}
                        </span>
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-sm font-bold text-white line-clamp-1">${item.title}</h3>
                        </div>
                        <p class="text-xs text-zinc-400 font-bold mb-2">${item.price}</p>
                        <p class="text-[11px] text-zinc-500 line-clamp-2 leading-relaxed mb-3">${item.story}</p>
                        <div class="flex justify-between items-center text-[10px] text-zinc-400 border-t border-zinc-800/80 pt-2">
                            <span>Designer: <strong class="text-zinc-200">${item.designer}</strong></span>
                            <span class="text-purple-400 font-bold">ストーリーを見る →</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 詳細モータルを表示
        function showDetail(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="rounded-2xl overflow-hidden h-72 mb-4 bg-zinc-950">
                    <img src="${item.image}" class="w-full h-full object-cover">
                </div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs font-bold text-purple-400 bg-purple-950/60 px-2.5 py-0.5 rounded border border-purple-800/50">${item.brand}</span>
                    <span class="text-xs text-zinc-500">${item.since}</span>
                </div>
                <h2 class="text-lg font-bold text-white mb-1">${item.title}</h2>
                <p class="text-base font-bold text-zinc-200 mb-4">${item.price}</p>

                <div class="glass-card p-3.5 rounded-xl border border-zinc-800 mb-4">
                    <h4 class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">DESIGNER STORY / CONCEPT</h4>
                    <p class="text-xs text-zinc-300 leading-relaxed">${item.story}</p>
                    <div class="mt-2 text-[10px] text-zinc-500">Designer: ${item.designer}</div>
                </div>

                <a href="${item.storeUrl}" target="_blank" class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg block text-center">
                    公式ストアで詳細・購入を見る <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
            `;

            openModal('detail-modal');
        }

        // フィルターボタン制御
        function filterItems(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-zinc-800', 'text-white');
                btn.classList.add('bg-zinc-900', 'text-zinc-400');
            });
            event.target.classList.remove('bg-zinc-900', 'text-zinc-400');
            event.target.classList.add('bg-zinc-800', 'text-white');

            renderCatalog(category);
        }

        // モーダル制御
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // 模擬AI検索
        function runAiRecommend() {
            const input = document.getElementById('ai-input').value;
            const result = document.getElementById('ai-result');
            
            if(!input) return;

            result.classList.remove('hidden');
            result.innerHTML = `
                <div class="flex items-center gap-2 mb-1 text-purple-400 font-bold">
                    <i class="fa-solid fa-sparkles"></i> AIアナライズ完了
                </div>
                <p class="text-zinc-300">「${input}」の雰囲気に合うアイテムとして、<b>NEO-CYBERIA</b>の『Over-Sized Cyber Zip Hoodie』がマッチしました。重厚感のあるストリートテイストとサイバー感が最適です。</p>
            `;
        }

        // 模擬申請送信
        function handleApply(e) {
            e.preventDefault();
            alert('掲載申請を受け付けました！確認後、ご連絡いたします。');
            closeModal('apply-modal');
        }

        // 初期描画
        renderCatalog();
    </script>
</body>
</html>
